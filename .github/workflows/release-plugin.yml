name: Release Obsidian Plugin

on:
  push:
    branches:
      - master
    tags:
      - 'plugin-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    defaults:
      run:
        working-directory: Client/obsidian-publisher

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Client/obsidian-publisher/package-lock.json
        # package-lock.json must be committed to the repo for npm caching to work

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Bump manifest version to match tag
        if: startsWith(github.ref, 'refs/tags/plugin-v')
        run: |
          tag="${GITHUB_REF#refs/tags/plugin-v}"
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = '$tag';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "

      - name: Check for optional styles.css
        if: startsWith(github.ref, 'refs/tags/plugin-v')
        id: styles
        run: |
          [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/plugin-v')
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            Client/obsidian-publisher/main.js
            ${{ steps.styles.outputs.exists == 'true' && 'Client/obsidian-publisher/styles.css' || '' }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/plugin-v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#plugin-v}"

          gh release create "$tag" \
            --title="Plugin v${version}" \
            --notes="## Obsidian Publisher Plugin v${version}

          Install manually: download the files below and place them in your vault's \`.obsidian/plugins/obsidian-publisher/\` folder." \
            main.js manifest.json \
            ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
