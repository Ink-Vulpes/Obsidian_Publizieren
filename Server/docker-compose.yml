# ─────────────────────────────────────────────────────────────────────────────
# Obsidian Publisher Stack
#
# Services:
#   caddy – Reverse proxy, handles HTTPS (ports 80 + 443)
#   web   – Rust web server (internal port 3000, not exposed)
#   mysql – MySQL 8 for user/session/permission data
#
# Quick start (with HTTPS):
#   1. Copy config.yml.example to config.yml and adjust settings.
#   2. Edit Caddyfile: replace "deine-domain.de" with your domain.
#   3. Set base_url in config.yml to "https://deine-domain.de".
#   4. docker compose up -d
#
# Local development (no domain, no HTTPS):
#   Set WEB_PORT=3000 in .env and comment out the caddy service.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Caddy (reverse proxy + automatic HTTPS) ──────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: obsidian-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  # ── Web server ───────────────────────────────────────────────────────────────
  web:
    image: ghcr.io/ink-vulpes/obsidian-publisher:latest
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obsidian-web
    restart: unless-stopped
    # Port only exposed locally for direct access / development.
    # In production Caddy handles traffic on 80/443.
    ports:
      - "${WEB_PORT:-127.0.0.1:3000}:3000"
    volumes:
      - vault-data:/vault
      - ./static:/app/static:ro
      - ./config.yml:/app/config.yml:ro
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy

  # ── MySQL ────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: obsidian-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootchangeme}"
      MYSQL_DATABASE: "obsidian"
      MYSQL_USER: "obsidian"
      MYSQL_PASSWORD: "${MYSQL_PASS:-changeme}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "obsidian", "--password=${MYSQL_PASS:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  vault-data:
    driver: local
  mysql-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# .env variables (create a .env file in this directory):
#
#   WEB_PORT=127.0.0.1:3000     # default: only localhost; set to 3000 for LAN access
#   MYSQL_ROOT_PASSWORD=a_strong_root_pw
#   MYSQL_PASS=a_strong_db_pw
#   RUST_LOG=info
# ─────────────────────────────────────────────────────────────────────────────
