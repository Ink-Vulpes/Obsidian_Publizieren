# ─────────────────────────────────────────────────────────────────────────────
# Obsidian Publisher Stack
#
# Services:
#   web   – Rust web server (port 3000)
#   mysql – MySQL 8 for user/session/permission data
#
# Quick start:
#   1. Copy config.yml.example to config.yml and adjust settings.
#   2. docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Web server ───────────────────────────────────────────────────────────────
  web:
    image: ghcr.io/ink-vulpes/obsidian-publisher:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obsidian-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - vault-data:/vault
      - ./static:/app/static:ro
      - ./config.yml:/app/config.yml:ro
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy

  # ── MySQL ────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: obsidian-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootchangeme}"
      MYSQL_DATABASE: "obsidian"
      MYSQL_USER: "obsidian"
      MYSQL_PASSWORD: "${MYSQL_PASS:-changeme}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "obsidian", "--password=${MYSQL_PASS:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  vault-data:
    driver: local
  mysql-data:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# .env variables (create a .env file in project root):
#
#   WEB_PORT=3000
#   MYSQL_ROOT_PASSWORD=a_strong_root_pw
#   MYSQL_PASS=a_strong_db_pw
#   RUST_LOG=info
# ─────────────────────────────────────────────────────────────────────────────
